<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- iOS 18.0.x standalone bug 绕开：必须 black，绝不用 black-translucent -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0a0a0f">
  <title>大富翁 · 大厅</title>
  <!-- 主题地基：boot.js 必须在任何样式之前同步跑，首屏防闪 -->
  <script src="/assets-theme/boot.js"></script>
  <script src="/assets-theme/icons.js"></script>
  <link rel="stylesheet" href="/assets-theme/base.css">
  <link rel="stylesheet" href="monopoly.css">
</head>
<body>
  <div class="cn-aurora"></div>

  <div class="lobby">
    <div class="lb-head">
      <h1>大富翁</h1>
      <p>开一间房，把房间号丢给对面，坐满就能开局</p>
    </div>

    <section class="cn-card lb-card">
      <div class="hd"><span class="ic" id="lb-ic-new"></span>开个新房间</div>
      <div class="mono-field">
        <span class="k">房间名</span>
        <input id="lb-room" maxlength="24" placeholder="比如「周五晚上别睡」">
      </div>
      <div class="mono-field">
        <span class="k">你的昵称</span>
        <input id="lb-name" maxlength="16" placeholder="怎么称呼你">
      </div>
      <div class="mono-field">
        <span class="k">棋子颜色</span>
        <div class="mono-swatches" id="lb-colors"></div>
      </div>
      <button class="mono-btn mono-btn--primary" id="lb-create">建房间并入座</button>
    </section>

    <section>
      <div class="lb-sec"><span class="mono-eyebrow">房间</span>
        <button class="mono-btn mono-btn--ghost mono-btn--sm" id="lb-refresh">刷新</button>
      </div>
      <div class="lb-rooms" id="lb-rooms"><div class="lb-empty">加载中…</div></div>
    </section>
  </div>

  <script src="js/api.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/board.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/lobby.js"></script>
</body>
</html>
