<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- iOS 18.0.x standalone bug 绕开：必须 black，绝不用 black-translucent -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0a0a0f">
  <title>大富豪 · 牌桌</title>
  <!-- 主题地基：boot.js 必须在任何样式之前同步跑，首屏防闪 -->
  <script src="/assets-theme/boot.js"></script>
  <script src="/assets-theme/icons.js"></script>
  <link rel="stylesheet" href="/assets-theme/base.css">
  <link rel="stylesheet" href="daifugo.css?v=20260819b">
</head>
<body class="df-room">
  <div class="cn-aurora"></div>

  <header class="df-top">
    <div class="df-top-row">
      <a class="df-back" id="r-back" href="/daifugo/" aria-label="回大厅"></a>
      <div class="df-title">
        <div class="nm" id="r-name">房间</div>
        <div class="cd" id="r-code"></div>
      </div>
      <button class="df-iconbtn" id="r-help" type="button" aria-label="玩法说明"></button>
      <button class="df-iconbtn" id="r-score" type="button" aria-label="计分板"></button>
      <button class="df-iconbtn" id="r-close" type="button" aria-label="关闭房间" hidden></button>
      <div class="df-link" id="r-conn" data-conn="retry"><span class="dot"></span><span class="tx">连接中</span></div>
    </div>
    <div class="df-seats" id="r-seats"></div>
  </header>

  <main class="df-stage" id="r-stage">
    <section class="df-field" id="r-field">
      <div class="df-turn" id="r-turn"></div>
      <div class="df-badges" id="r-badges"></div>
      <div class="df-pile" id="r-pile"></div>
      <div class="df-by" id="r-by"></div>
    </section>

    <!-- 流水 + 聊天混排的一条流，下面挂输入条。
         输入条**不能**用 position:fixed —— iOS 键盘弹起时 fixed 会漂，老老实实待在文档流里。 -->
    <div class="df-chatdock" id="r-chatdock">
      <div class="df-log" id="r-log"></div>
      <form class="df-chatbar" id="r-chatbar" autocomplete="off">
        <input class="df-chatin" id="r-chatin" type="text" maxlength="280" placeholder="说点什么…"
               enterkeyhint="send" aria-label="牌桌聊天">
        <button class="df-chatsend" id="r-chatsend" type="submit" aria-label="发送"></button>
      </form>
    </div>

    <div class="df-wait" id="r-wait" hidden></div>
  </main>

  <footer class="df-bottom">
    <div class="df-notice" id="r-notice" hidden></div>
    <div class="df-handzone" id="r-handzone" hidden>
      <div class="df-hand-head">
        <span id="r-mine"></span>
        <span class="hint" id="r-hint"></span>
      </div>
      <div class="df-fan" id="r-fan"></div>
    </div>
    <div class="df-acts" id="r-acts"></div>
  </footer>

  <!-- 引擎（出牌合法性预判用）。**没就绪也不影响玩**：DfRules 全部防御性调用，
       拿不到就整体降级——不预判、按钮全放开、错了由服务端 400 中文提示兜底。 -->
  <script src="/daifugo/engine.js?v=20260819b" onerror="console.warn('[daifugo] 引擎没加载上，前端预判降级')"></script>

  <script src="js/api.js?v=20260819b"></script>
  <script src="js/cards.js?v=20260819b"></script>
  <script src="js/rules.js?v=20260819b"></script>
  <script src="js/ui.js?v=20260819b"></script>
  <script src="js/room.js?v=20260819b"></script>
</body>
</html>
