<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- iOS 18.0.x standalone bug 绕开：必须 black，绝不用 black-translucent -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0a0a0f">
  <title>大富豪 · 大厅</title>
  <!-- 主题地基：boot.js 必须在任何样式之前同步跑，首屏防闪 -->
  <script src="/assets-theme/boot.js"></script>
  <script src="/assets-theme/icons.js"></script>
  <link rel="stylesheet" href="/assets-theme/base.css">
  <link rel="stylesheet" href="daifugo.css?v=20260819b">
</head>
<body>
  <div class="cn-aurora"></div>

  <div class="lobby">
    <div class="lb-head">
      <h1>大富豪</h1>
      <p>开一间房，把房间号丢给对面。2~4 人，出牌、革命、翻身当大富豪</p>
    </div>

    <section class="cn-card lb-card">
      <div class="hd"><span class="ic" id="lb-ic-new"></span>开个新房间</div>

      <div class="df-field-row">
        <span class="k">房间名</span>
        <input id="lb-room" maxlength="24" placeholder="比如「周五晚上别睡」">
      </div>
      <div class="df-field-row">
        <span class="k">你的昵称</span>
        <input id="lb-name" maxlength="16" placeholder="怎么称呼你">
      </div>

      <details class="df-rules">
        <summary>
          <span class="ic" id="lb-ic-rule"></span>
          <span class="tx"><span class="k">可选规则</span><span class="n" id="lb-rules-sum"></span></span>
          <span class="chev"></span>
        </summary>
        <div class="df-rules-body" id="lb-rules"></div>
        <button class="df-btn df-btn--ghost df-btn--sm" id="lb-help" type="button">这些规则看不懂？点我看玩法说明</button>
      </details>

      <details class="df-rules" open>
        <summary>
          <span class="ic" id="lb-ic-ai"></span>
          <span class="tx"><span class="k">请谁上桌</span><span class="n" id="lb-ai-sum"></span></span>
          <span class="chev"></span>
        </summary>
        <div class="df-rules-body" id="lb-ai"></div>
      </details>

      <button class="df-btn df-btn--primary df-btn--wide" id="lb-create">建房间并入座</button>
    </section>

    <section>
      <div class="lb-sec"><span class="df-eyebrow">房间</span>
        <button class="df-btn df-btn--ghost df-btn--sm" id="lb-refresh">刷新</button>
      </div>
      <div class="lb-rooms" id="lb-rooms"><div class="df-empty">加载中…</div></div>
    </section>
  </div>

  <script src="js/api.js?v=20260819b"></script>
  <script src="js/cards.js?v=20260819b"></script>
  <script src="js/rules.js?v=20260819b"></script>
  <script src="js/ui.js?v=20260819b"></script>
  <script src="js/lobby.js?v=20260819b"></script>
</body>
</html>
